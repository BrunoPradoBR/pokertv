[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokertv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "opencv-python>=4.9",
    "torch>=2.3",
    "torchvision>=0.18",
    "python-bidi==0.4.2",
    "paddleocr>=2.7",
    "pyyaml>=6.0",
    "dataclasses-json>=0.6",
    "click>=8.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
pokertv = "pokertv.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
